name: Déployer la version web

on:
  push:
    branches: [main]
    paths: ["web/**", "res/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r web res _site/
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=web/game_web.html"><a href="web/game_web.html">Jouer</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
